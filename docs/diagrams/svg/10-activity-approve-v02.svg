<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="900" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#111" stroke="#111" stroke-width="2">
    <text x="500" y="36" text-anchor="middle" stroke="none" font-size="25">Activity — Approve / Reject Reservation v0.2</text>
    <rect x="330" y="65" width="340" height="75" fill="white"/>
    <text x="500" y="95" text-anchor="middle" stroke="none" font-size="20">Admin opens</text>
    <text x="500" y="120" text-anchor="middle" stroke="none" font-size="20">PENDING_APPROVAL</text>
    <line x1="500" y1="140" x2="500" y2="180" marker-end="url(#arrow)"/>

    <polygon points="500,180 730,240 500,300 270,240" fill="white"/>
    <text x="500" y="247" text-anchor="middle" stroke="none" font-size="20">currentTime &gt;= startTime?</text>
    <line x1="650" y1="275" x2="800" y2="365" marker-end="url(#arrow)"/>
    <text x="730" y="310" stroke="none" font-size="18">Yes</text>
    <rect x="760" y="365" width="200" height="65" fill="white"/>
    <text x="860" y="405" text-anchor="middle" stroke="none" font-size="20">Set EXPIRED</text>

    <line x1="500" y1="300" x2="500" y2="350" marker-end="url(#arrow)"/>
    <text x="520" y="335" stroke="none" font-size="18">No</text>
    <polygon points="500,350 660,400 500,450 340,400" fill="white"/>
    <text x="500" y="407" text-anchor="middle" stroke="none" font-size="20">Admin decision?</text>

    <line x1="610" y1="435" x2="790" y2="525" marker-end="url(#arrow)"/>
    <text x="705" y="465" stroke="none" font-size="18">Reject</text>
    <rect x="750" y="525" width="220" height="65" fill="white"/>
    <text x="860" y="565" text-anchor="middle" stroke="none" font-size="20">Set REJECTED</text>

    <line x1="390" y1="435" x2="500" y2="515" marker-end="url(#arrow)"/>
    <text x="390" y="480" stroke="none" font-size="18">Approve</text>
    <polygon points="500,515 720,580 500,645 280,580" fill="white"/>
    <text x="500" y="574" text-anchor="middle" stroke="none" font-size="19">Agent active and</text>
    <text x="500" y="598" text-anchor="middle" stroke="none" font-size="19">no overlap?</text>

    <line x1="360" y1="625" x2="210" y2="730" marker-end="url(#arrow)"/>
    <text x="285" y="665" stroke="none" font-size="18">No</text>
    <rect x="40" y="730" width="340" height="85" fill="white"/>
    <text x="210" y="765" text-anchor="middle" stroke="none" font-size="19">Approval fails;</text>
    <text x="210" y="790" text-anchor="middle" stroke="none" font-size="19">remain PENDING_APPROVAL</text>

    <line x1="640" y1="625" x2="790" y2="730" marker-end="url(#arrow)"/>
    <text x="710" y="665" stroke="none" font-size="18">Yes</text>
    <rect x="650" y="730" width="300" height="85" fill="white"/>
    <text x="800" y="780" text-anchor="middle" stroke="none" font-size="20">Set CONFIRMED</text>
  </g>
</svg>
