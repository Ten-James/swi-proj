<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#111" stroke="#111" stroke-width="2">
    <text x="500" y="38" text-anchor="middle" stroke="none" font-size="25">Activity — Create Reservation v0.2</text>

    <rect x="350" y="70" width="300" height="70" fill="white"/>
    <text x="500" y="113" text-anchor="middle" stroke="none" font-size="21">Create request</text>

    <line x1="500" y1="140" x2="500" y2="180" marker-end="url(#arrow)"/>
    <polygon points="500,180 730,245 500,310 270,245" fill="white"/>
    <text x="500" y="252" text-anchor="middle" stroke="none" font-size="21">Common validation passes?</text>

    <line x1="350" y1="288" x2="210" y2="400" marker-end="url(#arrow)"/>
    <text x="266" y="334" text-anchor="middle" stroke="none" font-size="19">No</text>
    <rect x="70" y="400" width="280" height="70" fill="white"/>
    <text x="210" y="443" text-anchor="middle" stroke="none" font-size="21">Do not create</text>

    <line x1="500" y1="310" x2="500" y2="350" marker-end="url(#arrow)"/>
    <text x="520" y="338" stroke="none" font-size="19">Yes</text>
    <polygon points="500,350 690,410 500,470 310,410" fill="white"/>
    <text x="500" y="417" text-anchor="middle" stroke="none" font-size="21">Approval required?</text>

    <line x1="390" y1="450" x2="290" y2="560" marker-end="url(#arrow)"/>
    <text x="320" y="505" text-anchor="middle" stroke="none" font-size="19">No</text>
    <rect x="110" y="560" width="330" height="80" fill="white"/>
    <text x="275" y="608" text-anchor="middle" stroke="none" font-size="21">Create CONFIRMED</text>

    <line x1="610" y1="450" x2="710" y2="560" marker-end="url(#arrow)"/>
    <text x="680" y="505" text-anchor="middle" stroke="none" font-size="19">Yes</text>
    <rect x="560" y="560" width="370" height="80" fill="white"/>
    <text x="745" y="608" text-anchor="middle" stroke="none" font-size="21">Create PENDING_APPROVAL</text>
  </g>
</svg>
