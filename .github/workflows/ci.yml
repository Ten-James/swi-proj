name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    # Same single command as locally (README, C09): lint, typecheck, unit and architecture
    # checks, isolated SQLite, production build, real HTTP + DB integration suites
    # (C01, C02, C08, CR-08) and the release candidate manifest.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Verify (build + all checks)
        run: npm run verify

      - name: Upload verification logs and release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/
            .next/
            !.next/cache/
            !.next/node_modules/
          include-hidden-files: true
          if-no-files-found: warn
